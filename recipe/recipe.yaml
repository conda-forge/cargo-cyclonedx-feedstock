context:
  version: "0.5.10"

package:
  name: cargo-cyclonedx
  version: ${{ version }}

source:
  url: https://github.com/cyclonedx/cyclonedx-rust-cargo/archive/refs/tags/cargo-cyclonedx-${{ version }}.tar.gz
  sha256: 9a70987a8bda97615ba80127a76e73bb2c1a3cb285b76f1771e2f5c0b0cc2f6c

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --no-track --locked --root ${PREFIX} --path cargo-cyclonedx
          - cargo-bundle-licenses --format yaml --output ${SRC_DIR}/THIRDPARTY.yml
      - if: win
        then:
          - cargo auditable install --no-track --locked --root %PREFIX% --path cargo-cyclonedx
          - if errorlevel 1 exit 1
          - cargo-bundle-licenses --format yaml --output %SRC_DIR%/THIRDPARTY.yml
          - if errorlevel 1 exit 1

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - script:
      - cargo-cyclonedx --help

about:
  homepage: https://github.com/cyclonedx/cyclonedx-rust-cargo
  repository: https://github.com/cyclonedx/cyclonedx-rust-cargo
  documentation: https://github.com/cyclonedx/cyclonedx-rust-cargo
  summary: Creates CycloneDX Software Bill of Materials (SBOM) from Rust (Cargo) projects
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
    - THIRDPARTY.yml


extra:
  recipe-maintainers:
    - xhochy
